<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SB Dev Works</title>
  <meta name="description" content="SB Dev Works — independent software developer building focused, useful apps." />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="brand">
        <img src="assets/logo.png" alt="SB Dev Works logo" class="brand-logo" />
        <span class="brand-name">SB Dev Works</span>
      </a>
      <nav class="site-nav">
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
        <a href="https://github.com/Laedos" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="top" class="hero">
      <div class="container">
        <img src="assets/logo.png" alt="SB Dev Works logo" class="hero-logo" />
        <h1>SB Dev Works</h1>
        <p class="hero-tagline">Independent developer building small, focused apps.</p>
        <a class="button" href="https://github.com/Laedos" target="_blank" rel="noopener">View GitHub profile</a>
      </div>
    </section>

    <section id="projects" class="projects">
      <div class="container">
        <h2>Projects</h2>
        <div id="project-grid" class="project-grid"></div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="container">
        <h2>Contact</h2>
        <p>
          Email:
          <a href="mailto:sbdevworks@proton.me">sbdevworks@proton.me</a>
        </p>
        <p>
          <a href="https://github.com/Laedos" target="_blank" rel="noopener">github.com/Laedos</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> SB Dev Works</p>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script src="script.js"></script>
  <script src="year.js"></script>
</body>
</html>
